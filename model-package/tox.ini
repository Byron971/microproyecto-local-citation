# Automatiza entrenamiento y pruebas del paquete en un entorno aislado.
# Requiere tox 4:  pip install tox

[tox]
min_version = 4
env_list = test_package
skipsdist = true

[testenv]
basepython = python
package = skip
set_env =
	PYTHONPATH = {tox_root}
	PYTHONHASHSEED = 0

[testenv:test_package]
description = Ejecutar la suite del paquete
deps = -r{tox_root}/requirements/test_requirements.txt
commands = pytest {posargs:tests/}

[testenv:train]
description = Entrenar el artefacto con los datos del repositorio
deps = {[testenv:test_package]deps}
commands = python -m modelo_citas.train_pipeline --data-dir {posargs:{tox_root}/../data/raw}

[testenv:build]
description = Construir el wheel (requiere haber corrido antes tox -e train)
deps = build>=1.2,<2
commands = python -m build --wheel --outdir {tox_root}/dist {tox_root}
