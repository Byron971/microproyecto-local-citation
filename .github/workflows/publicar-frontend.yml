name: Publicar aplicación React (manual y autorizada)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Escribe PUBLISH para publicar React en S3/CloudFront (puede generar costos)'
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'citas-api' }}
  TF_INPUT: 'false'

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_publish == 'PUBLISH'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Exigir bucket existente
        run: |
          test -n "$TF_STATE_BUCKET" || {
            echo '::error::Configura TF_STATE_BUCKET en variables del repositorio.'
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - uses: ./.github/actions/aws-session
        with:
          region: ${{ env.AWS_REGION }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Inicializar estado existente
        run: terraform -chdir=terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION" -backend-config="key=$TF_VAR_project_name/terraform.tfstate"
      - name: Publicar assets verificados
        run: make publish-frontend
