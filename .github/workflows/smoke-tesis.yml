name: Smoke de aceptacion de tesis (baseline sin Gold)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ci/smoke_tesis.py'
      - 'tests/test_smoke_tesis.py'
      - '.github/workflows/smoke-tesis.yml'
      - 'src/app/**'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/smoke_tesis.py'
      - 'tests/test_smoke_tesis.py'
      - '.github/workflows/smoke-tesis.yml'
      - 'src/app/**'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Instalar API ligera
        run: uv sync --locked --group dev
      - name: Reglas de aceptación
        run: uv run pytest -q tests/test_smoke_tesis.py
      - name: Iniciar API baseline real
        run: |
          nohup uv run tablero > /tmp/tesis-api.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8000/api/estado >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tesis-api.log
          exit 1
      - name: Verificar línea base genuina y guardar evidencia
        run: |
          mkdir -p artifacts/qa_tesis
          uv run python scripts/ci/smoke_tesis.py --salida artifacts/qa_tesis/smoke_baseline.json
      - name: Reporte sin etiquetas humanas
        uses: actions/upload-artifact@v4
        with:
          name: smoke-tesis-baseline-sin-gold
          path: artifacts/qa_tesis/smoke_baseline.json
