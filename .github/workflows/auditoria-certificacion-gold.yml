name: Auditoria trazabilidad Test Gold (sin adjudicar)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/auditar_certificacion_gold.py"
      - "tests/test_auditar_certificacion_gold.py"
      - "tests/test_generar_cola_certificacion_gold.py"
      - "scripts/generar_cola_certificacion_gold.py"
      - "scripts/reconciliar_gold_xlsx.py"
      - "tests/test_reconciliar_gold_xlsx.py"
      - "scripts/auditar_metricas_provisionales.py"
      - "tests/test_auditar_metricas_provisionales.py"
      - "scripts/evaluar_predicciones_ms_pareadas.py"
      - "tests/test_evaluar_predicciones_ms_pareadas.py"
      - "proyecto_de_grado/anotacion/test_gold_final/**"
      - ".github/workflows/auditoria-certificacion-gold.yml"
  push:
    branches: [main]
    paths:
      - "scripts/auditar_certificacion_gold.py"
      - "tests/test_auditar_certificacion_gold.py"
      - "tests/test_generar_cola_certificacion_gold.py"
      - "scripts/generar_cola_certificacion_gold.py"
      - "scripts/reconciliar_gold_xlsx.py"
      - "tests/test_reconciliar_gold_xlsx.py"
      - "scripts/auditar_metricas_provisionales.py"
      - "tests/test_auditar_metricas_provisionales.py"
      - "scripts/evaluar_predicciones_ms_pareadas.py"
      - "tests/test_evaluar_predicciones_ms_pareadas.py"
      - "proyecto_de_grado/anotacion/test_gold_final/**"
      - ".github/workflows/auditoria-certificacion-gold.yml"

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas sinteticas del auditor
        run: |
          python -m pip install "pytest>=8,<10" "openpyxl==3.1.5"
          python -m pytest -q tests/test_auditar_certificacion_gold.py tests/test_generar_cola_certificacion_gold.py tests/test_reconciliar_gold_xlsx.py tests/test_auditar_metricas_provisionales.py tests/test_evaluar_predicciones_ms_pareadas.py
      - name: Revisar trazabilidad del Gold consolidado
        run: python scripts/auditar_certificacion_gold.py
      - name: Contabilizar tareas de revisión humana sin exportar textos
        run: python scripts/generar_cola_certificacion_gold.py --salida artifacts/cola_gold_privada.csv
      - name: Auditar métricas históricas provisionales sin reentrenar
        run: python scripts/auditar_metricas_provisionales.py
