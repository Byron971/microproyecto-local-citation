name: Regresion fragmentacion V1 y V2 (sin Gold)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'proyecto_de_grado/src/data/exportar_corpus_top3.py'
      - 'proyecto_de_grado/src/data/comparar_fragmentacion.py'
      - 'tests/test_comparar_fragmentacion_no_gold.py'
      - 'docs/comparacion_fragmentadores_no_gold.md'
      - '.github/workflows/fragmentacion-v1-v2.yml'
  push:
    branches: [main]
    paths:
      - 'proyecto_de_grado/src/data/exportar_corpus_top3.py'
      - 'proyecto_de_grado/src/data/comparar_fragmentacion.py'
      - 'tests/test_comparar_fragmentacion_no_gold.py'
      - 'docs/comparacion_fragmentadores_no_gold.md'
      - '.github/workflows/fragmentacion-v1-v2.yml'

permissions:
  contents: read

jobs:
  fragmentacion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Instalar paquete de test ligero
        run: uv sync --locked --group dev
      - name: Regressions de texto íntegro y mismo corpus
        run: uv run pytest -q tests/test_comparar_fragmentacion_no_gold.py
      - name: No se utilizan datos Test Gold ni pesos
        run: |
          echo "Solo fixtures sintéticos. La corrida con OCL real requiere caché verificada y es una etapa separada."
