name: Reporte Entrega 3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "reportes/reporte03/main.tex"
      - "reportes/reporte03/*.png"
      - ".github/workflows/reporte03.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: reportes/reporte03
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Instalar herramienta de inspección PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Verificar máximo de 10 páginas
        shell: bash
        run: |
          pages=$(pdfinfo reportes/reporte03/main.pdf | awk '/^Pages:/ {print $2}')
          echo "Páginas generadas: $pages"
          if [ -z "$pages" ]; then
            echo "No fue posible determinar el número de páginas."
            exit 1
          fi
          if [ "$pages" -gt 10 ]; then
            echo "El reporte supera el máximo de 10 páginas."
            exit 1
          fi

      - name: Publicar PDF como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-entrega-3
          path: reportes/reporte03/main.pdf

      - name: Crear Pull Request con PDF final
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/reporte-pdf-${{ github.run_id }}"
          git checkout -b "$branch"
          git add -f reportes/reporte03/main.pdf
          git commit -m "docs: genera PDF final de Entrega 3"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs: genera PDF final de Entrega 3" \
            --body "PDF compilado automáticamente desde reportes/reporte03/main.tex. La compilación pasó y el reporte cumple el máximo de 10 páginas."
