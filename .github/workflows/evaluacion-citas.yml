name: Evaluacion funcion de cita

on:
  workflow_dispatch:
  push:
    branches: [main, docs/correcciones-haydemar-v4, audit/preetiquetado-g0]
    paths:
      - "src/evaluation/**"
      - "proyecto_de_grado/**"
      - "tests/test_commercial_gold_policy.py"
      - "tests/test_commercial_doc_contract.py"
      - "tests/test_gold_freeze_audit.py"
      - "tests/test_gold_existing_csv_audit.py"
      - "tests/test_gold_manifest_reconcile.py"
      - "src/data/build_citation_function_pilot.py"
      - "tests/test_commercial*.py"
      - "tests/test_paired_benchmark.py"
      - "tests/test_gold_freeze_audit.py"
      - "tests/test_gold_existing_csv_audit.py"
      - "tests/test_gold_manifest_reconcile.py"
      - "tests/test_providers*.py"
      - "tests/test_annotation.py"
      - "tests/test_build_citation_function_pilot.py"
      - "config/prompts/citation_function_prompts.json"
      - ".github/workflows/evaluacion-citas.yml"
  pull_request:
    paths:
      - "src/evaluation/**"
      - "proyecto_de_grado/**"
      - "tests/test_commercial_gold_policy.py"
      - "tests/test_commercial_doc_contract.py"
      - "src/data/build_citation_function_pilot.py"
      - "tests/test_commercial*.py"
      - "tests/test_providers*.py"
      - "tests/test_annotation.py"
      - "tests/test_build_citation_function_pilot.py"
      - "config/prompts/citation_function_prompts.json"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: uv sync --group dev

      - name: Ejecutar pruebas de evaluación
        run: |
          uv run pytest -q \
            tests/test_commercial_cli.py \
            tests/test_commercial_io.py \
            tests/test_commercial_metrics.py \
            tests/test_paired_benchmark.py \
            tests/test_gold_freeze_audit.py \
            tests/test_gold_existing_csv_audit.py \
            tests/test_gold_manifest_reconcile.py \
            tests/test_commercial_gold_policy.py \
            tests/test_commercial_doc_contract.py \
            tests/test_commercial_orchestrate.py \
            tests/test_commercial_runner.py \
            tests/test_commercial_schema.py \
            tests/test_providers_openai.py \
            tests/test_providers_gemini.py \
            tests/test_providers_openweight.py \
            tests/test_annotation.py \
            tests/test_build_citation_function_pilot.py \
            proyecto_de_grado/tests

      - name: Auditar las anotaciones existentes sin reetiquetarlas
        run: |
          uv run python -m src.evaluation.commercial.gold_existing_csv_audit \
            --output-dir artifacts/auditoria-gold-csv-existente

      - name: Guardar evidencia agregada (sin texto de anotaciones)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-gold-csv-existente-no-certificada
          path: artifacts/auditoria-gold-csv-existente/gold_existing_audit.json
          if-no-files-found: ignore

      - name: Conciliar PR91 y PR92 sin cambiar sus Gold
        run: |
          uv run python -m src.evaluation.commercial.gold_manifest_reconcile \
            --output-dir artifacts/conciliacion-pr91-pr92

      - name: Adjuntar reporte agregado y huellas de manifiestos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conciliacion-gold-pr91-pr92-sin-certificacion
          path: artifacts/conciliacion-pr91-pr92/resumen_conciliacion_gold.json
          if-no-files-found: ignore
