name: Verificar registro A4 sin pesos ni Gold

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/app/checkpoint_gate.py"
      - "config/checkpoint_registry.json"
      - "tests/test_checkpoint_gate.py"
      - "proyecto_de_grado/docs/evidencias_clasificacion_a4/**/manifiesto.json"
      - ".github/workflows/checkpoint-gate.yml"
  pull_request:
    paths:
      - "src/app/checkpoint_gate.py"
      - "config/checkpoint_registry.json"
      - "tests/test_checkpoint_gate.py"
      - "proyecto_de_grado/docs/evidencias_clasificacion_a4/**/manifiesto.json"
      - ".github/workflows/checkpoint-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked --group dev
      - name: Unit tests del gate A4
        run: uv run pytest -q tests/test_checkpoint_gate.py
      - name: Contrastar registro con manifiestos históricos
        run: uv run python -m src.app.checkpoint_gate --permitir-faltantes
