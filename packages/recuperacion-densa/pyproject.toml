[project]
name = "recuperacion-densa"
version = "0.1.0"
description = "Evaluacion offline de recuperacion densa Top-3 con SciBERT frente a BM25 (issue #102)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["auditoria-corpus"]

[dependency-groups]
dev = ["pytest>=9.1.1"]
modelo = ["torch>=2.9", "transformers>=4.57", "huggingface-hub"]

[tool.uv]
# CI nunca instala torch: el grupo `modelo` es opt-in.
default-groups = ["dev"]

[tool.uv.sources]
auditoria-corpus = { path = "../auditoria-corpus", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recuperacion_densa"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers"
pythonpath = ["src", "../.."]
testpaths = ["tests"]
xfail_strict = true
