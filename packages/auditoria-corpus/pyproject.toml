[project]
name = "auditoria-corpus"
version = "0.1.0"
description = "Auditoria de extraccion, chunks y metadatos retoricos del corpus ACL-200 / ACL OCL (issue #101)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditoria_corpus"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers"
pythonpath = ["src", "../.."]
testpaths = ["tests"]
xfail_strict = true
