[project]
name = "clasificacion-funcion"
version = "0.1.0"
description = "Clasificacion de la funcion de la cita (9 clases) con SciBERT/SPECTER y Entradas A/B sobre el mismo Test Gold (issue #103)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["auditoria-corpus", "recuperacion-densa"]

[dependency-groups]
# scikit-learn solo se usa en la prueba de equivalencia de metricas.
dev = ["pytest>=9.1.1", "scikit-learn"]
modelo = ["torch>=2.9", "transformers>=4.57", "huggingface-hub", "safetensors"]

[tool.uv]
# CI nunca instala torch: el grupo `modelo` es opt-in.
default-groups = ["dev"]

[tool.uv.sources]
auditoria-corpus = { path = "../auditoria-corpus", editable = true }
recuperacion-densa = { path = "../recuperacion-densa", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clasificacion_funcion"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers"
pythonpath = ["src", "../.."]
testpaths = ["tests"]
xfail_strict = true
