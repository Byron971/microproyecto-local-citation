services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: microproyecto-citas-api:0.1.0
    container_name: microproyecto-citas-api
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/estado')"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: microproyecto-citas-dashboard:0.1.0
    container_name: microproyecto-citas-dashboard
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy