services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: microproyecto-citas-api:0.1.0
    container_name: microproyecto-citas-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: "0.0.0.0" # Necesario dentro de la red de Docker.
      APP_PORT: "8000" # Puerto interno fijo para healthcheck y proxy.
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      APP_RECOMMENDER_BACKEND: ${APP_RECOMMENDER_BACKEND:-packaged_tfidf_linear}
      APP_TOP3_BACKEND: ${APP_TOP3_BACKEND:-bm25_lexical}
      APP_MODEL_DEVICE: ${APP_MODEL_DEVICE:-cpu}
      APP_INSIGHTS_PATH: ${APP_INSIGHTS_PATH:-data/processed/dashboard_insights.json}
      TOP3_CORPUS_PATH: ${TOP3_CORPUS_PATH:-proyecto_de_grado/artifacts/top3_s2/casos_train.json}
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PUBLISHED_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/estado')"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: microproyecto-citas-dashboard:0.1.0
    container_name: microproyecto-citas-dashboard
    ports:
      - "${DASHBOARD_BIND_HOST:-127.0.0.1}:${DASHBOARD_PUBLISHED_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy