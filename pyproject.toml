[project]
name = "microproyecto-local-citation"
version = "0.1.0"
description = "Prototipo de recomendación local de citas académicas con análisis exploratorio, versionamiento de datos y una maqueta funcional en FastAPI."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]==0.141.1",
    "pydantic>=2,<3",
    "modelo-citas",
    "openai>=3.16.2",
]

[project.scripts]
maqueta-back = "maqueta.main:run_backend"
maqueta-front = "maqueta.front:run_frontend"
tablero = "src.app.main:run_backend"

# El modelo entrenado se consume como librería instalable, no como artefacto
# suelto: el wheel publicado trae el .pkl dentro. Se descarga del bucket S3 del
# proyecto, de modo que ni la imagen de la API ni un clon del repositorio
# necesitan model-package/, el dataset ni las dependencias de entrenamiento.
#
# Publicar una versión nueva del modelo: subir VERSION, entrenar, construir el
# wheel, subirlo a s3://ceduque-modelo-citas-wheels/wheels/ y actualizar la URL
# de abajo junto con `uv lock`. Un wheel publicado nunca se sobrescribe: el hash
# queda fijado en uv.lock y un cambio silencioso haría fallar la instalación.
[tool.uv.sources]
modelo-citas = { url = "https://ceduque-modelo-citas-wheels.s3.amazonaws.com/wheels/modelo_citas-0.2.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maqueta", "src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "tox>=4,<5",
]
# Solo para experimentación (notebooks, MLflow, DVC, análisis exploratorio):
# nada de esto entra en la imagen de la API. Instalar con
# `uv sync --group research`.
research = [
    "dvc[s3,ssh]==3.67.1",
    "jupyter==1.1.1",
    "ipykernel==7.3.0",
    "matplotlib==3.11.1",
    "pandas==2.3.3",
    "seaborn==0.13.2",
    "scikit-learn==1.9.0",
    "mlflow==3.15.1",
    "pyyaml>=6,<7",
]
