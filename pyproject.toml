[project]
name = "microproyecto-local-citation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dvc[s3]>=3.67.1",
    "fastapi[standard]>=0.141.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]

[project.scripts]
maqueta-front = "maqueta.front:run_frontend"
maqueta-back = "maqueta.main:run_backend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maqueta"]
