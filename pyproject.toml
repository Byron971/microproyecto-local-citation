[project]
name = "microproyecto-local-citation"
version = "0.1.0"
description = "Prototipo de recomendación local de citas académicas con análisis exploratorio, versionamiento de datos y una maqueta funcional en FastAPI."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]==0.141.1",
    "pydantic>=2,<3",
    "modelo-citas",
    "openai>=3.16.2",
]

[project.scripts]
maqueta-back = "maqueta.main:run_backend"
maqueta-front = "maqueta.front:run_frontend"
tablero = "src.app.main:run_backend"

# El modelo entrenado se consume como librería instalable, no como artefacto
# suelto: el paquete vive en model-package/ y trae el .pkl dentro del wheel.
[tool.uv.sources]
modelo-citas = { path = "model-package", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maqueta", "src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "tox>=4,<5",
]
# Solo para experimentación (notebooks, MLflow, DVC, análisis exploratorio):
# nada de esto entra en la imagen de la API. Instalar con
# `uv sync --group research`.
research = [
    "dvc[s3,ssh]==3.67.1",
    "jupyter==1.1.1",
    "ipykernel==7.3.0",
    "matplotlib==3.11.1",
    "pandas==2.3.3",
    "seaborn==0.13.2",
    "scikit-learn==1.9.0",
    "mlflow==3.15.1",
    "pyyaml>=6,<7",
]
