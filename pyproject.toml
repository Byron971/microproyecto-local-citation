[project]
name = "microproyecto-local-citation"
version = "0.1.0"
description = "Prototipo de recomendación local de citas académicas con análisis exploratorio, versionamiento de datos y una maqueta funcional en FastAPI."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "dvc[s3]==3.67.1",
    "jupyter==1.1.1",
    "ipykernel==7.3.0",
    "matplotlib==3.11.1",
    "pandas==2.3.3",
    "seaborn==0.13.2",
    "scikit-learn==1.9.0",
    "fastapi[standard]==0.141.1",
    "mlflow==3.15.1",
]

[project.scripts]
maqueta-back = "maqueta.main:run_backend"
maqueta-front = "maqueta.front:run_frontend"
tablero = "src.app.main:run_backend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maqueta", "src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
