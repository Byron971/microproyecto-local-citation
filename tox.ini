[tox]
min_version = 4
env_list = py314
skipsdist = true

[testenv]
description = Ejecutar la suite en un entorno aislado de Python 3.14
package = skip
deps =
    pytest>=9.1.1
    numpy
    scipy
    scikit-learn==1.9.0
    mlflow==3.15.1
    pyyaml>=6,<7
    pydantic>=2,<3
set_env =
    PYTHONPATH = {tox_root}
    PYTHONHASHSEED = 0
commands =
    pytest -q {posargs}

[testenv:smoke-model]
description = Validar rápidamente el flujo del reordenador con datos sintéticos
package = skip
deps = {[testenv]deps}
set_env = {[testenv]set_env}
commands =
    pytest -q \
        tests/test_pair_features.py \
        tests/test_build_hard_pairs.py \
        tests/test_linear_reranker.py \
        tests/test_run_linear_reranker.py \
        tests/test_model_workflow.py
