server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sirve la página principal del tablero.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mantiene las rutas /static/* que utiliza el tablero original.
    # Los archivos están almacenados directamente en la raíz de Nginx.
    location /static/ {
        alias /usr/share/nginx/html/;
    }

    # Envía las solicitudes de la interfaz al contenedor FastAPI.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}