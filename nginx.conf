server {
    listen 80;
    server_name _;

    # Cota HTTP al margen de la validación Pydantic de 60k caracteres.
    client_max_body_size 128k;
    client_body_timeout 20s;
    add_header X-Content-Type-Options nosniff always;

    root /usr/share/nginx/html;
    index index.html;

    # Sirve la página principal del tablero.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mantiene las rutas /static/* que utiliza el tablero original.
    # Los archivos están almacenados directamente en la raíz de Nginx.
    location /static/ {
        alias /usr/share/nginx/html/;
    }

    # Envía las solicitudes de la interfaz al contenedor FastAPI.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 45s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}